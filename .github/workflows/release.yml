# Builds the app and publishes a GitHub Release with the APK attached.
# Runs when a version tag is pushed (for example: git tag v0.2.1 && git push origin v0.2.1),
# or by hand from the Actions tab (then it only builds and keeps the APK as a workflow artifact).
name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build the APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Name the APK after the version
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || VERSION="build-${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/app-debug.apk "BX-Tracker-${VERSION}.apk"
          echo "APK=BX-Tracker-${VERSION}.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: bx-tracker-apk
          path: ${{ env.APK }}

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
          body: |
            Test build of BX Tracker (debug-signed, Android 8.0 or newer).

            **Install:** download the `.apk` below on your phone and open it. Android will ask you to allow
            installing apps from your browser or file manager; allow it, then tap Install. If Play Protect warns
            about an unknown app, tap "More details", then "Install anyway".
